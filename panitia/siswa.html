<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa - PPDB SMKN Tugumulyo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#0f4c81', secondary: '#f59e0b', sidebar: '#1e293b' }, fontFamily: { sans: ['Poppins', 'sans-serif'] } }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">
    <div class="flex h-screen overflow-hidden">
        <aside class="bg-sidebar text-white w-64 flex-shrink-0 hidden md:flex flex-col transition-all duration-300 z-20 h-full fixed md:relative shadow-xl">
            <div class="h-16 flex items-center justify-center border-b border-gray-700 bg-gray-900/50">
                <div class="flex items-center gap-2 font-bold text-lg">
                    <i class="fa-solid fa-user-shield text-secondary text-2xl"></i>
                    <span>PANITIA <span class="text-secondary">PPDB</span></span>
                </div>
            </div>
            <div class="p-6 border-b border-gray-700 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-gray-600 overflow-hidden border-2 border-primary">
                    <img src="https://ui-avatars.com/api/?name=Admin+Panitia&background=0f4c81&color=fff" alt="Admin" class="w-full h-full object-cover">
                </div>
                <div>
                    <h4 class="font-semibold text-sm">Pak Budi</h4>
                    <p class="text-xs text-green-400 flex items-center gap-1"><i class="fa-solid fa-circle text-[8px]"></i> Online</p>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                <a href="panitia.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition group">
                    <i class="fa-solid fa-chart-line w-5"></i> Dashboard
                </a>
                <a href="verifikasi.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition group">
                    <i class="fa-solid fa-file-circle-check w-5 group-hover:text-secondary transition"></i> 
                    <span class="flex-1">Verifikasi Berkas</span>
                    <span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">12</span>
                </a>
                <a href="siswa.html" class="flex items-center gap-3 px-4 py-3 bg-primary rounded-lg text-white transition shadow-lg shadow-blue-900/50">
                    <i class="fa-solid fa-users w-5 group-hover:text-secondary transition"></i> Data Siswa
                </a>
                <a href="laporan.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition group">
                    <i class="fa-solid fa-print w-5 group-hover:text-secondary transition"></i> Laporan
                </a>
                <a href="pengaturan.html" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition group">
                    <i class="fa-solid fa-gear w-5 group-hover:text-secondary transition"></i> Pengaturan
                </a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <a href="index.html" class="flex items-center gap-3 px-4 py-2 text-red-400 hover:bg-red-900/20 hover:text-red-300 rounded-lg transition w-full">
                    <i class="fa-solid fa-power-off w-5"></i> Logout
                </a>
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
                <h2 class="text-xl font-bold text-gray-800">Master Data Siswa</h2>
                <button class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700"><i class="fa-solid fa-file-excel mr-2"></i> Export Excel</button>
            </header>

            <main class="flex-1 overflow-auto bg-gray-100 p-6">
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex gap-4">
                        <input type="text" placeholder="Cari nama, NISN..." class="border rounded-lg px-4 py-2 text-sm w-64 focus:outline-none focus:ring-2 focus:ring-primary">
                        <select class="border rounded-lg px-4 py-2 text-sm focus:outline-none">
                            <option>Semua Jurusan</option>
                            <option>TKJ</option>
                            <option>DKV</option>
                            <option>TKR</option>
                        </select>
                        <select class="border rounded-lg px-4 py-2 text-sm focus:outline-none">
                            <option>Semua Status</option>
                            <option>Terverifikasi</option>
                            <option>Menunggu</option>
                            <option>Ditolak</option>
                        </select>
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-600 text-xs uppercase">
                            <tr>
                                <th class="p-4">No</th>
                                <th class="p-4">NISN</th>
                                <th class="p-4">Nama Siswa</th>
                                <th class="p-4">Jurusan</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm divide-y divide-gray-100">
                            <tr class="hover:bg-gray-50">
                                <td class="p-4 text-gray-500">1</td>
                                <td class="p-4 font-mono">0012345678</td>
                                <td class="p-4 font-bold text-gray-700">Budi Santoso</td>
                                <td class="p-4">TKJ</td>
                                <td class="p-4"><span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs">Menunggu</span></td>
                                <td class="p-4 text-center">
                                    <button class="text-blue-600 hover:text-blue-800 mx-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="text-red-600 hover:text-red-800 mx-1"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="p-4 text-gray-500">2</td>
                                <td class="p-4 font-mono">0098765432</td>
                                <td class="p-4 font-bold text-gray-700">Siti Aminah</td>
                                <td class="p-4">DKV</td>
                                <td class="p-4"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs">Terverifikasi</span></td>
                                <td class="p-4 text-center">
                                    <button class="text-blue-600 hover:text-blue-800 mx-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="text-red-600 hover:text-red-800 mx-1"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="p-4 text-sm text-gray-500 border-t flex justify-between items-center">
                        <span>Menampilkan 2 dari 1245 data</span>
                        <div class="flex gap-2">
                            <button class="px-2 py-1 border rounded hover:bg-gray-50">&lt;</button>
                            <button class="px-2 py-1 border rounded hover:bg-gray-50">&gt;</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
